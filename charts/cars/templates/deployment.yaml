apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cars.fullname" . }}
  labels:
    {{- include "cars.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cars.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cars.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cars
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CARS_DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
            - name: CARS_ALLOWED_HOSTS
              value: {{ .Values.config.allowedHosts | quote }}
            - name: CARS_SECURE_COOKIES
              value: "true"
            - name: CARS_INITIAL_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.secretName }}
                  key: CARS_INITIAL_PASSWORD_HASH
            - name: CARS_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.secretName }}
                  key: CARS_SESSION_SECRET
            - name: CARS_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.secretName }}
                  key: CARS_INGEST_TOKEN
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 4
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: {{ .Values.config.dataDir | quote }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "cars.fullname" . }}-data
        - name: tmp
          emptyDir: {}
