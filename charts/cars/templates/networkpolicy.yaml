apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cars.fullname" . }}
  labels:
    {{- include "cars.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cars.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: proxy-manager
          podSelector:
            matchLabels:
              io.kompose.service: proxy-manager-app
      ports:
        - protocol: TCP
          port: 8000
  egress: []
