[project]
name = "cars-dashboard"
version = "0.1.0"
description = "Private notes-enabled dashboard for daily vehicle search results."
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.138.1",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
  "uvicorn==0.49.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cars_app*"]
